[General]
network = simple_intersection_8.IntersectionScenarioInet
sim-time-limit = 300s
debug-on-errors = false
cmdenv-express-mode = true
cmdenv-autoflush = true
print-undisposed = false
**.scalar-recording = false
**.vector-recording = false

# Veins-INET manager
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("intersection.launchd.xml")
*.manager.moduleType = "benchmark.veins_inet.VeinsInetCar"
*.manager.moduleName = "node"
*.manager.moduleDisplayString = ""

# Node mobility
*.node[*].mobility.typename = "VeinsInetMobility"

# RAFT Application — simple 4-way intersection (W,S,E,N), 8 vehicles
*.node[*].numApps = 1
*.node[*].app[0].typename = "UdpRaftApplication"
*.node[*].app[0].middleware.typename = "benchmark.raft.UdpRaftApplication"
*.node[*].app[0].totalVehicles = 8
*.node[*].app[0].approachEdges = "W2C,S2C,E2C,N2C"
*.node[*].app[0].exitEdges = "C2E,C2N,C2W,C2S"
*.node[*].app[0].resultsFile = "raft_results.json"

# Distance-based intersection stopping
*.node[*].app[0].intersectionStopDistance = 5m
*.node[*].app[0].arrivalWaitTimeMs = 3000
*.node[*].app[0].discoveryWaitMs = 5000
*.node[*].app[0].clusterFormationDelayMs = 0

# RAFT Timing
*.node[*].app[0].electionTimeoutBaseMs = 500
*.node[*].app[0].electionTimeoutJitterMs = 1000
*.node[*].app[0].requestTimeoutMs = 200
*.node[*].app[0].maxFailedElections = 100
*.node[*].app[0].fallbackWaitMinMs = 100
*.node[*].app[0].fallbackWaitMaxMs = 300
*.node[*].app[0].passConfirmationMs = 300
*.node[*].app[0].statusCollectionTimeoutMs = 800

# IEEE 802.11a (Wi-Fi 5 GHz, CH36 = 5.18 GHz UNII-1) — DimensionalRadio, ad-hoc, SNIR-based
*.node[*].wlan[0].typename = "Ieee80211Interface"
*.node[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.node[*].wlan[0].mgmt.typename = "Ieee80211MgmtAdhoc"
*.node[*].wlan[0].radio.bandName = "5 GHz"
*.node[*].wlan[0].radio.channelNumber = 36
*.node[*].wlan[0].radio.centerFrequency = 5.18GHz
*.node[*].wlan[0].radio.bandwidth = 20MHz
*.node[*].wlan[0].radio.transmitter.power = 200mW
*.node[*].wlan[0].radio.transmitter.modeSet = "ieee80211a"
*.node[*].wlan[0].radio.transmitter.mode = "OFDM-6Mbps"
*.node[*].wlan[0].radio.receiver.sensitivity = -88dBm
*.node[*].wlan[0].mac.dcf.channelAccess.cwMin = 15

# Radio medium + path loss
*.radioMedium.typename = "Ieee80211DimensionalRadioMedium"
*.radioMedium.pathLoss.typename = "LogNormalShadowing"
*.radioMedium.pathLoss.alpha = 2.75
*.radioMedium.pathLoss.sigma = 4
