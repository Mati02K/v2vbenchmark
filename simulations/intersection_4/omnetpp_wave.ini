[General]
network = IntersectionScenarioWave
sim-time-limit = 300s
debug-on-errors = false
cmdenv-express-mode = true
cmdenv-autoflush = true
print-undisposed = false
**.scalar-recording = false
**.vector-recording = false

# Veins manager
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("intersection.launchd.xml")
*.manager.moduleType = "org.car2x.veins.nodes.Car"
*.manager.moduleName = "node"
*.manager.moduleDisplayString = ""

# Mobility
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false
*.node[*].veinsmobility0.x = 0
*.node[*].veinsmobility0.y = 0
*.node[*].veinsmobility0.z = 0
*.node[*].veinsmobility0.setHostSpeed = false

# World / Playground
*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m

# Connection Manager
# maxInterfDist must enclose the playground; SNIR decider handles actual range
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false

# MAC 802.11p / 1609.4
# txPower  = 20 mW  (13 dBm) — ETSI EN 302 663 default Tx power for ITS-G5
#            matches UDP baseline for fair PHY comparison
# bitrate  = 6 Mbps — QPSK r=1/2, mandatory robust mode (IEEE 802.11p)
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps

# RAFT Application
*.node[*].applType = "benchmark.raft.WillemtRaftWaveApplication"
*.node[*].appl.totalVehicles = 4
*.node[*].appl.approachEdges = "-34894202#13,34894202#10,36905242#11,37551802#8"
*.node[*].appl.exitEdges = "-34894202#10,34894202#13,-37551802#8,-36905242#11"
*.node[*].appl.resultsFile = "raft_results.json"

# RAFT Timing
*.node[*].appl.electionTimeoutBaseMs = 500
*.node[*].appl.electionTimeoutJitterMs = 1000
*.node[*].appl.requestTimeoutMs = 200
*.node[*].appl.maxFailedElections = 100
*.node[*].appl.fallbackWaitMinMs = 100
*.node[*].appl.fallbackWaitMaxMs = 300
*.node[*].appl.passConfirmationMs = 300
*.node[*].appl.statusCollectionTimeoutMs = 2000

# 802.11p NIC — analogue models and decider loaded from config.xml
*.node[*].nic.phy80211p.analogueModels = xmldoc("config.xml", "//AnalogueModel")
*.node[*].nic.phy80211p.decider = xmldoc("config.xml", "//Decider")

# sensitivity = -92 dBm  (kTB·10MHz + NF10 + SNIR_min@BPSK-1/2 + 3dB margin)
# Must match config.xml Decider sensitivity — kept here for clarity
*.node[*].nic.phy80211p.sensitivity = -92dBm

# maxTXPower = 20 mW  (13 dBm) — ETSI ITS-G5 Class C default; matches txPower
*.node[*].nic.phy80211p.maxTXPower = 20mW

# Thermal noise: kTB at 10 MHz BW
#   kTB = -174 dBm/Hz + 10·log10(10e6) = -174 + 70 = -104 dBm
#   With NF = 10 dB → effective thermal noise = -94 dBm
#   Using -94 dBm here; Veins adds NF implicitly via decider sensitivity
*.node[*].nic.phy80211p.useThermalNoise = true
*.node[*].nic.phy80211p.thermalNoise = -94dBm

# Noise floor: same as thermal noise reference (decider sensitivity accounts for margin)
*.node[*].nic.phy80211p.useNoiseFloor = true
*.node[*].nic.phy80211p.noiseFloor = -94dBm

# Propagation delay: enabled for realistic multi-hop timing
*.node[*].nic.phy80211p.usePropagationDelay = true

# minPowerLevel: packets below this are not processed; set == noiseFloor
*.node[*].nic.phy80211p.minPowerLevel = -94dBm
