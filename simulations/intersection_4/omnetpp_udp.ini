[General]
network = IntersectionScenarioInet
sim-time-limit = 300s
debug-on-errors = false
cmdenv-express-mode = true

# Veins-INET manager
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("intersection.launchd.xml")
*.manager.moduleType = "benchmark.veins_inet.VeinsInetCar"
*.manager.moduleName = "node"
*.manager.moduleDisplayString = ""

# Node mobility
*.node[*].mobility.typename = "VeinsInetMobility"

# RAFT Application
*.node[*].numApps = 1
*.node[*].app[0].typename = "WillemtRaftApplication"
*.node[*].app[0].middleware.typename = "benchmark.raft.WillemtRaftApplication"
*.node[*].app[0].totalVehicles = 4
*.node[*].app[0].approachEdges = "-34894202#13,34894202#10,36905242#11,37551802#8"
*.node[*].app[0].exitEdges = "-34894202#10,34894202#13,-37551802#8,-36905242#11"
*.node[*].app[0].resultsFile = "raft_results.json"

# Distance-based intersection stopping
*.node[*].app[0].intersectionStopDistance = 25m
*.node[*].app[0].arrivalWaitTimeMs = 2000

# RAFT Timing
*.node[*].app[0].electionTimeoutBaseMs = 500
*.node[*].app[0].electionTimeoutJitterMs = 1000
*.node[*].app[0].requestTimeoutMs = 200
*.node[*].app[0].maxFailedElections = 100
*.node[*].app[0].fallbackWaitMinMs = 100
*.node[*].app[0].fallbackWaitMaxMs = 300
*.node[*].app[0].passConfirmationMs = 300
*.node[*].app[0].statusCollectionTimeoutMs = 200

# ── IEEE 802.11a Baseline (Wi-Fi 5 GHz, SNIR-based, no hard-coded range) ──────
#
# Standard:  IEEE 802.11a (OFDM, 5 GHz band)
# Frequency: 5.0 GHz (UNII-1 / UNII-2 band, distinct from WAVE 5.9 GHz)
# Bandwidth: 20 MHz (standard 802.11a channel)
# Tx power : 20 mW (13 dBm) — equal to WAVE baseline for fair comparison
# PHY mode : 6 Mbps (BPSK r=1/2, lowest mandatory 802.11a rate = most robust)
#            matches WAVE 6 Mbps mandatory rate for apples-to-apples comparison
#
# Sensitivity = -82 dBm:
#   kTB(20 MHz) = -174 + 73 = -101 dBm
#   NF = 10 dB → noise = -91 dBm
#   Required Eb/N0 @ BPSK-1/2 ≈ 5 dB + 4 dB implementation loss + 3 dB link margin = 12dB total
#   BUT INET Ieee80211ScalarRadio sensitivity = threshold for reception (NF already in model)
#   IEEE 802.11-2020 Table 17-14: minimum sensitivity @ 6 Mbps = -82 dBm (20 MHz)
#   This is the standard-compliant floor; no more unrealistic -85 dBm (10 MHz WAVE value)
#
# Radio medium: Ieee80211ScalarRadioMedium uses path loss + SNIR model automatically
# communicationRange removed: range now determined purely by path loss + SNIR threshold
*.node[*].wlan[0].typename = "Ieee80211Interface"
*.node[*].wlan[0].radio.typename = "Ieee80211ScalarRadio"

# Frequency / Bandwidth
*.node[*].wlan[0].radio.centerFrequency = 5.0GHz
*.node[*].wlan[0].radio.bandwidth = 20MHz

# Transmit power: 20 mW = 13 dBm (matches WAVE; EIRP well within FCC Part 15 / ETSI)
*.node[*].wlan[0].radio.transmitter.power = 20mW

# PHY mode: 6 Mbps OFDM (BPSK r=1/2) — lowest mandatory 802.11a rate
*.node[*].wlan[0].radio.transmitter.modeSet = "ieee80211a"
*.node[*].wlan[0].radio.transmitter.mode = "OFDM-6Mbps"

# Receiver sensitivity: IEEE 802.11-2020 Table 17-14 minimum @ 6 Mbps / 20 MHz
*.node[*].wlan[0].radio.receiver.sensitivity = -82dBm

# MAC: DCF with standard 802.11a CWmin for AC_BK (background / best-effort UDP)
*.node[*].wlan[0].mac.dcf.channelAccess.cwMin = 15

# ── PHY Propagation: NLOS Urban log-distance + shadowing ──────────────────
# Matches the WAVE config.xml analogue models for a fair apples-to-apples comparison.
# alpha = 2.75: Winner+ B1 urban intersection NLOS (same as WAVE SimplePathlossModel)
# sigma = 4 dB: Winner+ B1 recommended lognormal shadowing std-dev
*.radioMedium.pathLoss.typename = "LogNormalShadowing"
*.radioMedium.pathLoss.alpha = 2.75
*.radioMedium.pathLoss.sigma = 4
