[General]
network = IntersectionScenarioWave
sim-time-limit = 300s
debug-on-errors = false
cmdenv-express-mode = true
cmdenv-autoflush = true
print-undisposed = false
**.scalar-recording = false
**.vector-recording = false

# Veins manager — launchConfig overridden per [Config] below
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.moduleType = "org.car2x.veins.nodes.Car"
*.manager.moduleName = "node"
*.manager.moduleDisplayString = ""

# Mobility
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false
*.node[*].veinsmobility0.x = 0
*.node[*].veinsmobility0.y = 0
*.node[*].veinsmobility0.z = 0
*.node[*].veinsmobility0.setHostSpeed = false

# World / Playground
*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m

# Connection Manager
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false
*.connectionManagerName = "connectionManager"
*.connectionManager.pMax = 20mW
*.connectionManager.sat = -89dBm
*.connectionManager.alpha = 2.0
*.connectionManager.carrierFrequency = 5.890e9 Hz

# MAC 802.11p / 1609.4 — CH178 (5.89 GHz CCH)
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.mac1609_4.queueSize = 1024
*.**.nic.mac1609_4.cwMin = 3
*.**.nic.mac1609_4.cwMax = 7

# RAFT Application — shared settings (totalVehicles set per [Config])
*.node[*].applType = "benchmark.raft.WaveRaftApplication"
*.node[*].appl.approachEdges = "W2C,S2C,E2C,N2C"
*.node[*].appl.exitEdges = "C2E,C2N,C2W,C2S"
*.node[*].appl.resultsFile = "raft_results.json"
*.node[*].appl.intersectionStopDistance = 5m

# Building obstacle polygons
*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

# 802.11p NIC — pass whole config.xml so BasePhyLayer finds all AnalogueModels by tag name
*.node[*].nic.phy80211p.analogueModels = xmldoc("config.xml")
*.node[*].nic.phy80211p.decider = xmldoc("config.xml")
*.node[*].nic.phy80211p.txPower = 20mW
*.node[*].nic.phy80211p.minPowerLevel = -110dBm
*.node[*].nic.phy80211p.useNoiseFloor = true
*.node[*].nic.phy80211p.noiseFloor = -98dBm
*.node[*].nic.phy80211p.usePropagationDelay = true
*.node[*].nic.phy80211p.ccaThreshold = -90dBm
*.node[*].nic.phy80211p.antennaOffsetY = 1.895m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895m

# ============================================================
# Per-vehicle-count configurations
# ============================================================

[Config Veh4]
*.manager.launchConfig = xmldoc("intersection_4veh.launchd.xml")
*.node[*].appl.totalVehicles = 4

[Config Veh8]
*.manager.launchConfig = xmldoc("intersection_8veh.launchd.xml")
*.node[*].appl.totalVehicles = 8

[Config Veh16]
*.manager.launchConfig = xmldoc("intersection_16veh.launchd.xml")
*.node[*].appl.totalVehicles = 16

[Config Veh20]
*.manager.launchConfig = xmldoc("intersection_20veh.launchd.xml")
*.node[*].appl.totalVehicles = 20

[Config Veh24]
*.manager.launchConfig = xmldoc("intersection_24veh.launchd.xml")
*.node[*].appl.totalVehicles = 24

[Config Veh32]
*.manager.launchConfig = xmldoc("intersection_32veh.launchd.xml")
*.node[*].appl.totalVehicles = 32
