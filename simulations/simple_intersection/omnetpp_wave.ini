[General]
network = IntersectionScenarioWave
sim-time-limit = 300s
debug-on-errors = false
cmdenv-express-mode = true
cmdenv-autoflush = true
print-undisposed = false
**.scalar-recording = false
**.vector-recording = false

# Veins manager
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("intersection.launchd.xml")
*.manager.moduleType = "org.car2x.veins.nodes.Car"
*.manager.moduleName = "node"
*.manager.moduleDisplayString = ""

# Mobility
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false
*.node[*].veinsmobility0.x = 0
*.node[*].veinsmobility0.y = 0
*.node[*].veinsmobility0.z = 0
*.node[*].veinsmobility0.setHostSpeed = false

# World / Playground (must enclose network; simple intersection ~400x400m)
*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m

# Connection Manager
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false

# MAC 802.11p / 1609.4 — CH178 (5.89 GHz CCH) from config.xml
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 200mW
*.**.nic.mac1609_4.bitrate = 6Mbps

# RAFT Application — simple 4-way intersection (W,S,E,N)
*.node[*].applType = "benchmark.raft.WaveRaftApplication"
*.node[*].appl.totalVehicles = 16
*.node[*].appl.approachEdges = "W2C,S2C,E2C,N2C"
*.node[*].appl.exitEdges = "C2E,C2N,C2W,C2S"
*.node[*].appl.resultsFile = "raft_results.json"

# Distance-based intersection stopping
*.node[*].appl.intersectionStopDistance = 5m
# RAFT Timing: 5 s formation window at intersection
*.node[*].appl.discoveryWaitMs = 5000
*.node[*].appl.clusterFormationDelayMs = 0
*.node[*].appl.electionTimeoutBaseMs = 500
*.node[*].appl.electionTimeoutJitterMs = 1000
*.node[*].appl.requestTimeoutMs = 200
*.node[*].appl.maxFailedElections = 100
*.node[*].appl.fallbackWaitMinMs = 100
*.node[*].appl.fallbackWaitMaxMs = 300
*.node[*].appl.passConfirmationMs = 300
*.node[*].appl.statusCollectionTimeoutMs = 800

# 802.11p NIC — from config.xml
*.node[*].nic.phy80211p.analogueModels = xmldoc("config.xml", "//AnalogueModel")
*.node[*].nic.phy80211p.decider = xmldoc("config.xml", "//Decider")
*.node[*].nic.phy80211p.sensitivity = -88dBm
*.node[*].nic.phy80211p.maxTXPower = 200mW
*.node[*].nic.phy80211p.useThermalNoise = true
*.node[*].nic.phy80211p.thermalNoise = -104dBm
*.node[*].nic.phy80211p.useNoiseFloor = true
*.node[*].nic.phy80211p.noiseFloor = -94dBm
*.node[*].nic.phy80211p.usePropagationDelay = true
*.node[*].nic.phy80211p.minPowerLevel = -94dBm
