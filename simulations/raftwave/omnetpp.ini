[General]
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 1s
**.cmdenv-log-level = info

ned-path = ..:../../src:../../../inet/src:../../../inet/examples:../../../inet/tutorials:../../../inet/showcases:../../../../veins/examples/veins:../../../../veins/src/veins

network = IntersectionScenario

##########################################################
#            Simulation parameters                       #
##########################################################
sim-time-limit = 300s
debug-on-errors = false
print-undisposed = false
**.scalar-recording = false
**.vector-recording = false

##########################################################
#            TraCI and SUMO settings                      #
##########################################################
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("intersection.launchd.xml")
*.manager.moduleType = "raft.WillemtRaftWaveApplication"

##########################################################
#                    World parameters                    #
##########################################################
*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m

##########################################################
#                     WAVE Application                   #
##########################################################
*.node[*].applType = "raft.WillemtRaftWaveApplication"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.beaconInterval = 1s
*.node[*].appl.beaconUserPriority = 7

# RAFT parameters - matching UDP for fair comparison
*.node[*].appl.electionTimeoutBaseMs = 150
*.node[*].appl.electionTimeoutJitterMs = 50
*.node[*].appl.heartbeatIntervalMs = 50
*.node[*].appl.fallbackWaitMinMs = 100
*.node[*].appl.fallbackWaitMaxMs = 300
*.node[*].appl.passConfirmationMs = 50
*.node[*].appl.statusCollectionTimeoutMs = 500

##########################################################
#                 NIC (802.11p settings)                 #
##########################################################
*.node[*].nicType = "Nic80211p"

# MAC Layer - WAVE/DSRC (CH178 = 5.89 GHz from config.xml)
*.node[*].nic.mac1609_4.useServiceChannel = false
*.node[*].nic.mac1609_4.txPower = 200mW
*.node[*].nic.mac1609_4.bitrate = 6Mbps

# PHY Layer - Publication-quality realistic parameters
# TX Power: 200 mW (23 dBm) per SAE J2945.1
# Sensitivity: -85 dBm for 10 MHz @ 6 Mbps
# Noise floor: -97 dBm (kTB + 7dB NF)
*.node[*].nic.phy80211p.sensitivity = -85dBm
*.node[*].nic.phy80211p.maxTXPower = 200mW
*.node[*].nic.phy80211p.useThermalNoise = true
*.node[*].nic.phy80211p.thermalNoise = -110dBm
*.node[*].nic.phy80211p.useNoiseFloor = true
*.node[*].nic.phy80211p.noiseFloor = -97dBm
*.node[*].nic.phy80211p.decider = xmldoc("config.xml")
*.node[*].nic.phy80211p.analogueModels = xmldoc("config.xml", "//AnalogueModel")
*.node[*].nic.phy80211p.usePropagationDelay = true
*.node[*].nic.phy80211p.minPowerLevel = -110dBm
